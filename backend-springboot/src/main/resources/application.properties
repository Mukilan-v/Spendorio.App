# ==============================================================================
# SPENDORIO SPRING BOOT APPLICATION CONFIGURATION
# ==============================================================================

spring.application.name=spendorio-backend

# Run on port 3000 so the Cloudflare Tunnel, shortcuts, and PWA connect seamlessly
server.port=3000

# File paths relative to backend directory
spendorio.data.dir=../data
spendorio.public.dir=../public

# Request payload limits for backup data
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Logging configuration
logging.level.root=INFO
logging.level.com.spendorio=DEBUG
